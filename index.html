<style>
/* Layout: 上部バー＋ナビ、本文は1カラム。案件詳細は「工程ステッパー → 工程パネル」。書類は紙面プレビュー */
:root{
  --bg:#f2f4f7; --surface:#ffffff; --surface2:#f7f9fb; --ink:#16233a; --muted:#5a6679; --line:#dce2ea;
  --navy:#1f3a5f; --navy-mid:#7f9cc2; --navy-soft:#e3eaf3; --stamp:#c03a22;
  --ok:#2c7a4b; --ok-soft:#e1f1e7; --warn:#a86a10; --warn-soft:#fbefd9; --bad:#b93a2c; --bad-soft:#f9e2df;
  --paper:#fffefb; --paper-ink:#1d1d1d; --paper-line:#bfb9ae;

  --f-doc:"Shippori Mincho","Hiragino Mincho ProN","Yu Mincho",serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f141b; --surface:#171f2a; --surface2:#1c2633; --ink:#e4e9f0; --muted:#97a3b4; --line:#2a3544;
  --navy:#93b6e0; --navy-mid:#4d6a92; --navy-soft:#22324a; --stamp:#e0634a;
  --ok:#6cc596; --ok-soft:#183324; --warn:#e3b058; --warn-soft:#352812; --bad:#ef8576; --bad-soft:#3a1d19;
  --paper:#f6f3ec; --paper-ink:#1d1d1d; --paper-line:#bfb9ae; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f141b; --surface:#171f2a; --surface2:#1c2633; --ink:#e4e9f0; --muted:#97a3b4; --line:#2a3544;
  --navy:#93b6e0; --navy-mid:#4d6a92; --navy-soft:#22324a; --stamp:#e0634a;
  --ok:#6cc596; --ok-soft:#183324; --warn:#e3b058; --warn-soft:#352812; --bad:#ef8576; --bad-soft:#3a1d19;
  --paper:#f6f3ec; --paper-ink:#1d1d1d; --paper-line:#bfb9ae; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.65;font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

nav.tabs{display:flex;gap:4px;flex-wrap:wrap;flex:1}
nav.tabs button{background:none;border:0;padding:6px 12px;border-radius:6px;cursor:pointer;color:var(--muted);font-weight:500}
nav.tabs button[aria-current="true"]{background:var(--navy-soft);color:var(--navy)}
.btn{border:1px solid var(--line);background:var(--surface);padding:7px 14px;border-radius:6px;cursor:pointer;font-weight:500;white-space:nowrap}
.btn:hover{border-color:var(--navy)}

.alert .t{flex:1;min-width:0}
/* bars */
.bars{display:grid;gap:14px;align-items:end;height:190px;padding-top:10px;border-bottom:1px solid var(--line)}

.bar .c,.lg.c{background:var(--navy)} .bar .k,.lg.k{background:var(--navy-mid)} .bar .y,.lg.y{background:var(--navy-soft);border:1px dashed var(--navy)}

.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
/* stepper */
.stepper{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;counter-reset:s}
.step{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 10px;cursor:pointer;text-align:left;min-width:0}

.step .lb{font-weight:700;font-size:13px}

.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:2px 20px;margin:0}
.facts div{display:flex;justify-content:space-between;gap:10px;border-bottom:1px dotted var(--line);padding:5px 0;min-width:0}
.facts dt{color:var(--muted);font-size:12.5px;white-space:nowrap}
.facts dd{margin:0;text-align:right;font-weight:500;min-width:0;overflow-wrap:anywhere}
/* checklist */
.checklist{display:grid;gap:6px}
.ck{display:grid;grid-template-columns:28px 1fr auto;gap:10px;align-items:center;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.ck .no{font-family:var(--f-doc);font-size:17px;color:var(--muted);text-align:center}
.ck.has{background:var(--ok-soft);border-color:transparent} .ck.has .no{color:var(--ok)}

.ck label.btn{display:inline-block}
.ck input[type=file]{position:absolute;width:1px;height:1px;opacity:0}
/* form */
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px 18px}
.fld{display:grid;gap:4px;min-width:0}
.fld label{font-size:12.5px;color:var(--muted)}
.fld input,.fld select,.fld textarea{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:7px 10px;width:100%;min-width:0}
.fld label.chk{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--ink);cursor:pointer;width:max-content;max-width:100%;margin-top:2px}
.fld label.chk input{width:16px;height:16px;padding:0;margin:0;flex:none;accent-color:var(--navy)}
.unit{position:relative} .unit input{padding-right:34px} .unit span{position:absolute;right:10px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:12.5px}

.seg-ctl label:last-child{border-right:0}
.seg-ctl input{position:absolute;opacity:0;width:1px;height:1px}
.seg-ctl input:checked+span{color:var(--navy);font-weight:700}
.seg-ctl label:has(input:checked){background:var(--navy-soft)}

.doctabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.doctabs button{border:1px solid var(--line);background:var(--surface);padding:5px 12px;border-radius:99px;cursor:pointer;font-size:13px}

.paperwrap{overflow-x:auto;background:var(--surface2);border-radius:8px;padding:18px}
.paper{background:var(--paper);color:var(--paper-ink);font-family:var(--f-doc);width:620px;max-width:none;margin:0 auto;padding:40px 44px;box-shadow:0 1px 3px rgba(0,0,0,.12),0 8px 24px rgba(0,0,0,.06);position:relative;font-size:13.5px;line-height:1.8}

.paper table{font-size:13px}
.paper th,.paper td{border:1px solid var(--paper-line);color:var(--paper-ink);padding:6px 9px;font-weight:400}

.paper .iss{margin-top:26px;text-align:right;line-height:1.7;font-size:12.5px}
.paper .hanko{position:absolute;right:44px;bottom:40px;width:56px;height:56px;border:2px solid #c03a22;color:#c03a22;border-radius:6px;display:grid;place-items:center;font-size:12px;line-height:1.15;text-align:center;transform:rotate(-4deg);opacity:.85}
.paper .note{font-size:11.5px;margin-top:14px}
.paper .tot td{font-weight:700}
/* folder */
.tree{font-size:13.5px;display:grid;gap:3px}
.tree .f{display:flex;gap:8px;align-items:center;padding:4px 8px;border-radius:6px;min-width:0}

.tree .f span.name{overflow-wrap:anywhere;min-width:0}

/* スマホ表示 */
@media (max-width:640px){

  .topin{gap:10px}
  .brand span{display:none}
  nav.tabs{order:3;flex:0 0 100%;flex-wrap:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}
  nav.tabs button{white-space:nowrap;padding:8px 12px}

  main{padding-block:16px 48px;gap:14px}

<script>
let COMPANY={},PAYDAYS=7;
const todayStr=()=>{const t=new Date();return`${t.getFullYear()}-${String(t.getMonth()+1).padStart(2,'0')}-${String(t.getDate()).padStart(2,'0')}`};
const addDays=(s,n)=>{if(!s)return'';const t=new Date(s+'T00:00:00');t.setDate(t.getDate()+n);return`${t.getFullYear()}-${String(t.getMonth()+1).padStart(2,'0')}-${String(t.getDate()).padStart(2,'0')}`};
/* 祥日＋振替休日＋国民の休日＋銀行の年末年始休業日（2026・2027年）。本番では祝日データを自動更新 */
let HOLIDAYS=new Set();
const isBiz=s=>{const w=new Date(s+'T00:00:00').getDay();return w!==0&&w!==6&&!HOLIDAYS.has(s)};
const nextBiz=s=>{let t=s;while(t&&!isBiz(t))t=addDays(t,1);return t};
const daysTo=s=>Math.round((new Date(s+'T00:00:00')-new Date(todayStr()+'T00:00:00'))/864e5);
</script><script>
/* ===== 共有ロジック（サーバーとブラウザの両方で使う） ===== */
const KINDS=['土地','新築戸建','中古戸建','収益（区分）','収益（一棟）'];
const areaKeys=k=>k==='土地'?['land']:k==='収益（区分）'?['bldg']:['land','bldg'];
function areaOf(kind,land,bldg){const ak=areaKeys(kind);const L=ak.includes('land')?+land||0:0,B=ak.includes('bldg')?+bldg||0:0;
  const t=kind==='土地'?`土地 ${L.toFixed(2)}㎡`:kind==='収益（区分）'?`専有 ${B.toFixed(2)}㎡`:`土地 ${L.toFixed(2)}㎡／建物 ${B.toFixed(2)}㎡`;
  return{landArea:L||null,bldgArea:B||null,area:t}}
const STAGES=['契約予定','契約報告','決済準備','決済報告','書類保管','歩合請求'];
const TYPE={sale:'売買仲介',buy:'自社買取',rent:'賃貸仲介'};
const CIRC='①②③④⑤⑥⑦⑧⑨⑩⑪⑫⑬⑭⑮⑯⑰⑱⑲⑳';
const fmt=n=>Math.round(+n||0).toLocaleString('ja-JP');
const yen=n=>'¥'+fmt(n);
const jd=s=>{if(!s)return'—';const[y,m,d]=s.split('-');return`${y}年${+m}月${+d}日`};
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
/* ---------- 業務ロジック ---------- */
function brokerFee(p){if(p<=2e6)return p*0.05;if(p<=4e6)return p*0.04+20000;return p*0.03+60000}
const exTax=v=>Math.round((+v||0)/1.1);
const hasBroker=d=>d.type==='rent'||(d.feeType||'').includes('仲介手数料');
const hasItaku=d=>d.type!=='rent'&&(d.feeType||'').includes('業務委託料');
const sidesOf=d=>d.type==='sale'&&d.side==='両手'?2:1;
/* 仲介手数料の上限額（税込・参考） */
function autoBrokerIn(d){if(d.type==='rent')return Math.round((+d.rent||0)*(+d.feeMonths||1)*1.1);return Math.round(Math.floor(brokerFee(+d.price||0))*sidesOf(d)*1.1)}
/* 会社売上（税別）＝ 入力された税込額 ÷ 1.1 */
function revenue(d){
  let r=0;if(hasBroker(d))r+=exTax(d.brokerIn);if(hasItaku(d))r+=exTax(d.itakuIn);

}

function taxSplit(d){
  const tax=+d.tax||0;if(!tax||!d.settleDate)return{tax,buyer:0,days:0,total:0};
  const h=new Date(d.settleDate+'T00:00:00');let y=h.getFullYear();
  let start=d.taxStart==='4/1'?new Date(y,3,1):new Date(y,0,1);if(h<start){y--;start=d.taxStart==='4/1'?new Date(y,3,1):new Date(y,0,1)}
  const end=new Date(start.getFullYear()+1,start.getMonth(),start.getDate());
  const total=Math.round((end-start)/864e5),days=Math.round((end-h)/864e5);
  return{tax,buyer:Math.round(tax*days/total),days,total,start,end};
}

/* 会社売上（税込）＝ 仲介手数料（税込）＋ 業務委託料（税込）＋ AD（税込） */
function revenueIn(d){let r=0;if(hasBroker(d))r+=+d.brokerIn||0;if(hasItaku(d))r+=+d.itakuIn||0;if(d.type==='rent')r+=Math.round((+d.rent||0)*(+d.adRate||0)/100*1.1);return r}
/* 歩合：会社売上（税込）× 歩合率。登録番号ありはその額（税込）を支払。未登録は消費税相当を除いた額（÷1.1）を支払 */
const rateOf=(a,d)=>a?(d.type==='rent'&&a.rateRent!=null&&a.rateRent!==''?+a.rateRent:+a.rate):0;
const isReg=a=>!!(a&&(a.registered||a.invoiceNo));
/* 免税事業者からの仕入に係る経過措置の控除割合（取引日＝決済日で判定）。令和8年度改正後 */
function keikaRate(dt){dt=dt||'';if(dt<'2026-10-01')return 0.8;if(dt<'2028-10-01')return 0.7;if(dt<'2030-10-01')return 0.5;if(dt<'2031-10-01')return 0.3;return 0}
const SPECIAL_CAP=10000000; /* 特例は年間（暦年）の歩合1,000万円まで */
function grossOf(d,agents){const a=agents.find(x=>x.id===d.agent);return Math.floor(revenueIn(d)*rateOf(a,d)/100)}
function payoutCalc(d,agents,deals){const a=agents.find(x=>x.id===d.agent);const r=revenue(d),ri=revenueIn(d),rate=rateOf(a,d);const g=Math.floor(ri*rate/100);
  const reg=isReg(a);let p=g,t=0,ded=0,note='';
  if(reg){t=g-Math.floor(g*10/11)}
  else if(a&&a.special){
    /* 経過措置（2026/10〜：免税事業者からの仕入は消費税相当の70%を控除可）→ 控除できない30%分だけ差し引く。年1,000万円を超えた部分は通常どおり÷1.1 */
    const y=(d.settleDate||'').slice(0,4);
    const before=deals.filter(x=>x.agent===d.agent&&x.id!==d.id&&(x.settleDate||'').slice(0,4)===y&&((x.settleDate||'')<(d.settleDate||'')||((x.settleDate||'')===(d.settleDate||'')&&x.id<d.id))).reduce((s2,x)=>s2+grossOf(x,agents),0);

  } else {p=Math.floor(g*10/11);ded=g-p;note='適格請求書発行事業者の登録なし'}
  return{rev:r,revIn:ri,rate,gross:g,deduct:g-p,reg,pay:p,tax:t,total:p,keep:ri-p,agent:a,note}}

async function apiPost(token,action,payload){

  if(p==='thisMonth')return[f(y,m,1),f(y,m+1,0)];
  if(p==='lastMonth')return[f(y,m-1,1),f(y,m,0)];
  if(p==='quarter'){const q=Math.floor(m/3)*3;return[f(y,q,1),f(y,q+3,0)]}
  if(p==='next3')return[f(y,m,1),f(y,m+3,0)];
  if(p==='year')return[f(y,0,1),f(y,11,31)];
  if(p==='last12')return[f(y,m-11,1),f(y,m+1,0)];
  return null;
}

const icoFolder=()=>`<svg class="ico" viewBox="0 0 16 16"><path d="M1.5 3.5h5l1.5 1.5h6.5v8h-13z" fill="none" stroke="currentColor" stroke-width="1.2"/></svg>`;

function issuer(){return`<div class="iss">${jd(UI.docDate||todayStr())}<br>${COMPANY.addr}<br><b>${COMPANY.name}</b><br>${COMPANY.rep}<br>宅地建物取引業免許 ${COMPANY.license}</div><div class="hanko">株式会社<br>sIgNaL<br>之印</div>`}
function paper(d,k){
  const tx=taxSplit(d);const rev=revenue(d);
  if(k==='receipt'){
    const fb=feeBreakdown(d);const pin=d.type==='rent'?fb.brokerIn:fb.perIn,per=exTax(pin);
    const to=d.type==='rent'?d.buyer:(d.side==='売主側'?d.seller:d.buyer);
    return`<div class="paper"><h4>領収書</h4><div class="to">${esc(to)} 様</div>
    <div class="amt">金 ${fmt(pin)} 円也</div><div>但し　${esc(d.name)}　${d.type==='rent'?'賃貸借':'売買'}の媒介報酬として</div>
    <table style="margin-top:12px;width:60%"><tr><th>税抜金額</th><td style="text-align:right">${yen(per)}</td></tr><tr><th>消費税（10%）</th><td style="text-align:right">${yen(pin-per)}</td></tr></table>
    <div class="note">登録番号 T〇〇〇〇〇〇〇〇〇〇〇〇〇（サンプル）${d.side==='両手'?'<br>※両手取引のため、売主様宛にも同額の領収書を作成します。':''}</div>${issuer()}</div>`}
  if(k==='itakuinv'||k==='itakurcpt'){
    const ain=+d.itakuIn||0,amt=exTax(ain),atx=ain-amt;const to=d.itakuPayer||d.buyer;
    if(k==='itakurcpt')return`<div class="paper"><h4>領収書</h4><div class="to">${esc(to)} 様</div>
    <div class="amt">金 ${fmt(ain)} 円也</div><div>但し　${esc(d.name)}　に係る業務委託料として</div>
    <table style="margin-top:12px;width:60%"><tr><th>税抜金額</th><td style="text-align:right">${yen(amt)}</td></tr><tr><th>消費税（10%）</th><td style="text-align:right">${yen(atx)}</td></tr></table>
    <div class="note">登録番号 T〇〇〇〇〇〇〇〇〇〇〇〇〇（サンプル）</div>${issuer()}</div>`;
    return`<div class="paper"><h4>請求書</h4><div class="to">${esc(to)} 御中</div><p>業務委託契約に基づき、下記のとおりご請求申し上げます。</p>
    <table style="width:100%"><tr><th style="width:30%">件名</th><td>${esc(d.name)}　業務委託料</td></tr><tr><th>物件所在</th><td>${esc(d.location)}</td></tr><tr><th>税抜金額</th><td style="text-align:right">${yen(amt)}</td></tr><tr><th>消費税（10%）</th><td style="text-align:right">${yen(atx)}</td></tr><tr class="tot"><th>ご請求額（税込）</th><td style="text-align:right">${yen(ain)}</td></tr><tr><th>お支払期日</th><td>${jd(d.settleDate)}（決済日）</td></tr><tr><th>お振込先</th><td>${COMPANY.bank}</td></tr></table>
    <div class="note">登録番号 T〇〇〇〇〇〇〇〇〇〇〇〇〇（サンプル）</div>${issuer()}</div>`}
  if(k==='handover'){
    return`<div class="paper"><h4>引渡確認書</h4><p>${esc(d.type==='buy'?COMPANY.name:d.buyer)}（以下「買主」）は、${esc(d.seller)}（以下「売主」）との間で ${jd(d.contractDate)} 付で締結した不動産売買契約に基づき、下記不動産の引渡しを本日受けたことを確認します。</p>
    <table style="width:100%"><tr><th style="width:28%">所在</th><td>${esc(d.location)}</td></tr><tr><th>種類</th><td>${esc(d.kind)}</td></tr><tr><th>面積</th><td>${esc(d.area)}</td></tr><tr><th>売買代金</th><td>${yen(d.price)}</td></tr><tr><th>引渡日</th><td>${jd(d.settleDate)}</td></tr><tr><th>鍵・書類</th><td>鍵　　本／関係書類一式</td></tr></table>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:28px;font-size:12.5px"><div>売主　住所<br><br>　　　氏名　　　　　　　　　　印</div><div>買主　住所<br><br>　　　氏名　　　　　　　　　　印</div></div>
    <div class="note">立会人：${COMPANY.name}　${esc(agentName(d.agent))}</div></div>`}
  if(k==='seisan'){
    return`<div class="paper"><h4>固定資産税等精算書</h4><table style="width:100%">
    <tr><th style="width:40%">令和8年度 年税額</th><td style="text-align:right">${yen(tx.tax)}</td></tr>
    <tr><th>起算日</th><td>${tx.start?jd(`${tx.start.getFullYear()}-${String(tx.start.getMonth()+1).padStart(2,'0')}-01`):'—'}（${d.taxStart}起算）</td></tr>
    <tr><th>引渡日</th><td>${jd(d.settleDate)}</td></tr>
    <tr><th>買主負担日数</th><td style="text-align:right">${tx.days}日 ／ ${tx.total}日</td></tr>
    <tr class="tot"><th>買主負担額（売主へ支払）</th><td style="text-align:right">${yen(tx.buyer)}</td></tr>
    <tr><th>売主負担額</th><td style="text-align:right">${yen(tx.tax-tx.buyer)}</td></tr></table>
    <div class="note">計算式：${fmt(tx.tax)} × ${tx.days} ÷ ${tx.total}（1円未満四捨五入）。日割り方法・起算日は契約書の定めに従います。</div>${issuer()}</div>`}
  if(k==='kishu'){
    const rem=(+d.price||0)-(+d.deposit||0);const fee=d.type==='sale'&&hasBroker(d)?feeBreakdown(d).perIn:0;
    const rows=[['売買代金 残代金',`${yen(d.price)} − 手付金 ${yen(d.deposit)}`,rem,d.type==='buy'?'売主様口座':'売主様口座',d.sellerBank],
      ['固定資産税等精算金','精算書のとおり',tx.buyer,'売主様口座',d.sellerBank],
      ...(fee?[['仲介手数料（税込）',d.side==='両手'?'買主様ご負担分':'当社報酬',fee,COMPANY.name,COMPANY.bank]]:[]),
      ...(d.type==='sale'&&d.feeType.includes('業務委託料')&&(+d.itakuIn||0)?[['業務委託料（税込）',`${esc(d.itakuPayer||d.buyer)} ご負担`,+d.itakuIn,COMPANY.name,COMPANY.bank]]:[]),
      ...(+d.judicial?[['登記費用','司法書士見積',+d.judicial,'司法書士','当日ご案内']]:[])];
    const tot=rows.reduce((s,r)=>s+r[2],0);
    return`<div class="paper"><h4>決済金種一覧</h4><div style="margin-bottom:8px">${esc(d.name)}　決済日 ${jd(d.settleDate)}　${d.type==='buy'?'支払者：'+COMPANY.name:'買主様ご用意分'}</div>
    <table style="width:100%"><tr><th>項目</th><th>内訳</th><th style="text-align:right">金額</th><th>振込先</th></tr>
    ${rows.map(r=>`<tr><td>${r[0]}</td><td style="font-size:12px">${r[1]}</td><td style="text-align:right;white-space:nowrap">${yen(r[2])}</td><td style="font-size:12px">${esc(r[3])}<br>${esc(r[4])}</td></tr>`).join('')}
    <tr class="tot"><td colspan="2">合計</td><td style="text-align:right;white-space:nowrap">${yen(tot)}</td><td></td></tr></table>
    <div class="note">管理費・修繕積立金・賃料等の精算がある場合は行を追加します。</div></div>`}
  if(k==='adinv'){
    const ad=(+d.rent||0)*(+d.adRate||0)/100;
    return`<div class="paper"><h4>請求書</h4><div class="to">${esc(d.otherBroker||d.seller)} 御中</div><p>下記のとおり広告料（AD）をご請求申し上げます。</p>
    <table style="width:100%"><tr><th>物件</th><td>${esc(d.location)}</td></tr><tr><th>契約日</th><td>${jd(d.contractDate)}</td></tr><tr><th>賃料</th><td>${yen(d.rent)}</td></tr><tr><th>広告料</th><td>${ad?`賃料の${d.adRate}%　${yen(ad)}（税別）`:'ADなし'}</td></tr><tr class="tot"><th>ご請求額（税込）</th><td>${yen(ad*1.1)}</td></tr><tr><th>お振込先</th><td>${COMPANY.bank}</td></tr></table>${issuer()}</div>`}
  return'';
}

  const p=payout(d),a=p.agent;
  return`<div class="paper"><h4>請求書</h4>
  <div style="display:flex;justify-content:space-between;gap:20px"><div><div class="to">${COMPANY.name} 御中</div><div style="font-size:12.5px">${COMPANY.addr}</div></div>

  ${p.reg?'':R(`消費税相当額の控除（${p.note}）`,`△${yen(p.deduct)}`)}
  <tr class="tot"><td colspan="${cs}">${p.reg?'合計（税込）':'合計（お支払額）'}</td><td style="text-align:right">${yen(p.total)}</td></tr>
  ${p.reg?R('うち消費税（10%対象）',yen(p.tax)):''}</table>`})()}
  <div style="margin-top:20px;font-size:12.5px;line-height:1.8">【請求者】<br>${esc(a.addr)}<br><b style="font-size:14px">${a.company?esc(a.company)+'</b><br>'+esc(a.signer||('代表 '+a.name)):esc(a.name)+'</b>'}　印<br>TEL ${esc(a.tel)}　${esc(a.mail)}<br>${a.invoiceNo?'登録番号 '+esc(a.invoiceNo)+'<br>':(isReg(a)?'登録番号（要入力）<br>':'')}振込先：${esc(a.bank)}</div></div>`;
}

/* ---------- 台帳・エージェント ---------- */
function vLedger(){
  return`<div class="row spread"><h1>契約台帳（宅建業法 第49条 帳簿）</h1><span class="pill">スプレッドシート連携イメージ</span></div>
  <div class="note-box">契約報告の申請時に1行ずつ自動記帳されます。帳簿は事務所ごとに備え付け、各事業年度末に閉鎖し、閉鎖後5年間（当社が自ら売主となる新築住宅は10年間）保存します。</div>
  <section class="panel"><div class="tbl"><table><thead><tr><th>No.</th><th>取引年月日</th><th>物件所在</th><th>種類</th><th>面積</th><th>取引態様</th><th>売主・貸主</th><th>買主・借主</th><th>関与した他業者</th><th class="num">価格・賃料</th><th class="num">報酬額</th><th>担当</th><th>特約等</th></tr></thead>
  <tbody>${S.ledger.map((r,i)=>({r,i})).filter(({r})=>isAdmin()||(S.deals.find(d=>d.id===r.dealId)||{}).agent===ROLE).map(({r,i},j)=>`<tr class="click" data-act="open" data-id="${r.dealId}"><td>${isAdmin()?i+1:j+1}</td><td>${jd(r.date)}</td><td>${esc(r.location)}</td><td>${esc(r.kind)}</td><td>${esc(r.area)}</td><td>${esc(r.mode)}</td><td>${esc(r.seller)}</td><td>${esc(r.buyer)}</td><td>${esc(r.other)}</td><td class="num">${esc(r.price)}</td><td class="num">${esc(r.fee)}</td><td>${esc(r.agent)}</td><td>${esc(r.special)}</td></tr>`).join('')}</tbody></table></div></section>`;
}
function vAgents(){
  const inp=(a,f,w,t='text')=>`<input class="inline-edit" style="width:${w}px;text-align:${t==='number'?'right':'left'}" type="${t}" id="${f}_${a.id}" data-agent="${a.id}" data-f="${f}" value="${esc(a[f]??'')}" aria-label="${esc(a.name)} ${f}">`;
  const chk=(a,f,l)=>`<input type="checkbox" id="${f}_${a.id}" data-agent="${a.id}" data-f="${f}" ${a[f]?'checked':''} aria-label="${esc(a.name)} ${l}">`;
  return`<div class="row spread"><h1>エージェント・歩合</h1><a class="lnk small" target="_blank" href="https://docs.google.com/spreadsheets/d/${esc((UI.links||{}).db||'')}/edit">データベース（スプレッドシート）を開く</a></div>
  <div class="note-box">歩合＝会社売上（税込）× 歩合率（売買・賃貸で別々に設定可）。インボイス登録ありはその額を支払い、未登録は消費税相当額（÷1.1）を差し引きます。「特例」は経過措置に合わせて会社が控除できない分だけを差し引きます（暦年の歩合1,000万円まで）。ログインにはメールアドレスとパスコードが必要です。パスコードは「発行」ボタンで設定し、本人に伝えてください。</div>
  <section class="panel"><div class="tbl"><table><thead><tr><th>氏名</th><th>メール（ログインID）</th><th>有効</th><th>ログイン</th><th class="num">売買</th><th class="num">賃貸</th><th>インボイス</th><th>特例</th><th>請求名義（法人）</th><th>署名</th><th>登録番号</th><th>宅建士</th><th>住所</th><th>電話</th><th>振込先</th></tr></thead>
  <tbody>${S.agents.map(a=>`<tr><td>${inp(a,'name',120)}${a.role==='管理者'?' <span class="pill">管理者</span>':''}</td><td>${inp(a,'email',190,'email')}</td><td>${chk(a,'active','有効')}</td><td><button class="btn sm" data-act="setpass" data-id="${a.id}">${a.hasPass?'再発行':'発行'}</button></td><td class="num">${inp(a,'rate',56,'number')}%</td><td class="num">${inp(a,'rateRent',56,'number')}%</td><td>${chk(a,'registered','インボイス登録')}</td><td>${chk(a,'special','特例')}</td><td>${inp(a,'company',170)}</td><td>${inp(a,'signer',170)}</td><td>${inp(a,'invoiceNo',140)}</td><td>${chk(a,'takken','宅建士')}</td><td>${inp(a,'addr',200)}</td><td>${inp(a,'tel',120)}</td><td>${inp(a,'bank',220)}</td></tr>`).join('')}</tbody></table></div></section>
  <form class="panel" id="addAgentForm"><h2>エージェントを追加</h2><div class="form">
    <div class="fld"><label for="na_name">氏名</label><input id="na_name" required></div>
    <div class="fld"><label for="na_email">メール</label><input id="na_email" type="email"></div>
    <div class="fld"><label for="na_rate">売買歩合（%）</label><input id="na_rate" type="number" value="80"></div>
    <div class="fld"><label for="na_rent">賃貸歩合（%）</label><input id="na_rent" type="number" value="80"></div>
    <div class="fld"><label class="chk"><input type="checkbox" id="na_reg"> インボイス登録あり</label><label class="chk"><input type="checkbox" id="na_tk"> 宅建士</label></div>
  </div><div class="row" style="margin-top:12px"><button class="btn primary" type="submit">追加する</button></div></form>`;
}
/* ---------- 下書き（一時保存）：サーバーに保存（スマホ⇔パソコンで続きを入力できる）。通信できないときはこの端末にも控えを保存 ---------- */
const draftKey=()=>'signal-draft-'+(ROLE||'');
let SDRAFT;/* undefined=未取得, null=なし */
function localDraft(){try{return JSON.parse(localStorage.getItem(draftKey())||'null')}catch(_){return null}}
function getDraft(){const l=localDraft();if(SDRAFT===undefined)return l;if(!SDRAFT)return l&&l.pending?l:null;if(l&&l.pending&&l.at>SDRAFT.at)return l;return SDRAFT}
async function pullDraft(){try{const r=await apiPost(TOKEN,'getDraft',{});if(r&&r.ok){SDRAFT=r.data;const l=localDraft();if(l&&l.pending&&(!SDRAFT||l.at>SDRAFT.at))pushDraft(l)}}catch(_){}}
async function pushDraft(d){try{const r=await apiPost(TOKEN,'saveDraft',{v:d.v});if(r&&r.ok){SDRAFT=r.data;try{localStorage.setItem(draftKey(),JSON.stringify({...d,pending:false}))}catch(_){}return true}}catch(_){}return false}
function delDraft(){SDRAFT=null;try{localStorage.removeItem(draftKey())}catch(_){}apiPost(TOKEN,'delDraft',{}).catch(()=>{})}
function collectDraft(){const f=document.getElementById('newForm');if(!f)return null;const v={};
  f.querySelectorAll('input,select,textarea').forEach(el=>{if(el.type==='radio'){if(el.checked)v['r:'+el.name]=el.value}else if(el.type==='checkbox')v[el.id]=el.checked;else if(el.id)v[el.id]=el.value});
  return{v,at:new Date().toISOString(),pending:true}}
function saveDraftLocal(){const d=collectDraft();if(!d)return null;try{localStorage.setItem(draftKey(),JSON.stringify(d))}catch(_){}return d}
function restoreDraft(){const dr=getDraft();const f=document.getElementById('newForm');if(!dr||!f)return;
  Object.entries(dr.v).forEach(([k,val])=>{if(k.startsWith('r:')){const r=f.querySelector(`input[name="${k.slice(2)}"][value="${val}"]`);if(r)r.checked=true;return}
    const el=document.getElementById(k);if(!el)return;if(el.type==='checkbox')el.checked=!!val;else el.value=val;if(k==='f_bfee'&&val)el.dataset.touched='1'})}
const draftAt=dr=>{const t=new Date(dr.at);return`${t.getMonth()+1}/${t.getDate()} ${String(t.getHours()).padStart(2,'0')}:${String(t.getMinutes()).padStart(2,'0')}`};
let draftTimer=null;function autoDraft(){clearTimeout(draftTimer);draftTimer=setTimeout(()=>{const d=saveDraftLocal();if(d)pushDraft(d)},1500)}
/* ---------- 描画とイベント ---------- */
function render(){
  renderNav();const app=document.getElementById('app');
  app.innerHTML=UI.view==='dash'?vDash():UI.view==='deals'?vDeals():UI.view==='new'?vNew():UI.view==='deal'?vDeal():UI.view==='ledger'?vLedger():UI.view==='sales'?vSales():isAdmin()?vAgents():vDash();
  if(UI.view==='deal'&&!deal()){UI.view='dash';app.innerHTML=vDash()}
  if(UI.view==='new'){restoreDraft();syncForm()}
}
async function stage(d,to,msg,html){try{const r=await call('setStage',{id:d.id,to,html});putDeal(r);UI.stageView=null;UI.flagMissing=false;toast(msg);render()}catch(e){if(to===2||to===4)UI.flagMissing=true;render()}}
document.addEventListener('click',async e=>{
  const el=e.target.closest('[data-act]');if(!el)return;const act=el.dataset.act;const d=deal();
  if(act==='view'){UI.view=el.dataset.v;window.scrollTo(0,0)}
  else if(act==='new'){document.getElementById('busy').hidden=false;await pullDraft();document.getElementById('busy').hidden=true;UI.view='new';window.scrollTo(0,0)}
  else if(act==='draftsave'){clearTimeout(draftTimer);const dd=saveDraftLocal();if(!dd){toast('一時保存できませんでした');return}
    document.getElementById('busy').hidden=false;const okS=await pushDraft(dd);document.getElementById('busy').hidden=true;
    toast(okS?'一時保存しました。スマホ・パソコンどちらからでも、ホーム画面の「続きを入力」から再開できます':'通信できないため、この端末に一時保存しました（つながったら自動でサーバーにも保存します）');UI.view='dash';window.scrollTo(0,0)}
  else if(act==='draftdel'){delDraft();toast('下書きを破棄しました');UI.view='new';render();window.scrollTo(0,0);return}
  else if(act==='open'){UI.view='deal';UI.dealId=el.dataset.id;UI.stageView=null;UI.docTab=null;UI.flagMissing=false;window.scrollTo(0,0)}
  else if(act==='stage'){UI.stageView=+el.dataset.s;UI.flagMissing=false}
  else if(act==='doctab'){UI.docTab=el.dataset.k}
  else if(act==='capfee'){const bf=document.getElementById('f_bfee');bf.value=autoBrokerIn(readForm());bf.dataset.touched='';syncForm();return}
  else if(act==='logout'){try{await call('logout',{},{quiet:true})}catch(_){}try{localStorage.removeItem('signal-token')}catch(_){}TOKEN=null;location.reload();return}
  else if(act==='mypass'){UI.view='mypass';renderMyPass();return}
  else if(act==='setpass'){const p=String(Math.floor(100000+Math.random()*900000));try{await call('setPasscode',{id:el.dataset.id,pass:p});const a=S.agents.find(x=>x.id===el.dataset.id);a.hasPass=true;render();showPass(a,p)}catch(_){}return}
  else if(act==='advance'){stage(d,d.stage+1,d.stage===0?'契約報告に進みました':'完了報告に進みました');return}
  else if(act==='report1'){const m=missing(d,'契約');if(m.length){UI.flagMissing=true;toast(`必須書類が不足しています：${m.map(x=>x.n).join('、')}`);render();return}stage(d,2,'契約報告を受け付け、契約台帳に記帳しました');return}
  else if(act==='genpdf'){const k=el.dataset.k;const lbl=(genDocsFor(d).find(x=>x[0]===k)||[k,k])[1];const html=document.querySelector('.paperwrap .paper').outerHTML;
    try{const r=await call('makePdf',{id:d.id,key:k,title:lbl,html});putDeal(r);toast('PDFを作成して案件フォルダに保存しました');render()}catch(_){}return}
  else if(act==='report2'){const m=missing(d,'決済');if(m.length){UI.flagMissing=true;toast(`必須書類が不足しています：${m.map(x=>x.n).join('、')}`);render();return}stage(d,4,'完了報告を受け付けました');return}
  else if(act==='store'){const m=missing(d);if(m.length){toast(`保管前に不足書類をアップロードしてください（${m.length}点）`);return}stage(d,5,'保管を確定しました');return}
  else if(act==='claim'){const html=document.querySelector('.paperwrap .paper').outerHTML;stage(d,6,'歩合請求書を申請し、PDFを保存しました',html);return}
  else return;
  render();
});
function showPass(a,p){const app=document.getElementById('app');const box=document.createElement('div');box.className='alert warn';box.innerHTML=`<div class="t"><b>${esc(a.name)} のパスコード：<span style="font-size:20px;letter-spacing:.1em">${p}</span></b><br>この画面を閉じると再表示できません。本人に伝えてください（ログインIDはメール：${esc(a.email||'未登録')}）。</div><button class="btn sm">閉じる</button>`;box.querySelector('button').onclick=()=>box.remove();app.prepend(box);window.scrollTo(0,0)}
function renderMyPass(){document.getElementById('app').innerHTML=`<form class="panel login" id="passForm"><h1>パスコード変更</h1>
  <div class="fld"><label for="mp_old">今のパスコード</label><input id="mp_old" type="password" inputmode="numeric" required></div>
  <div class="fld"><label for="mp_new">新しいパスコード（6桁以上の数字）</label><input id="mp_new" type="password" inputmode="numeric" pattern="[0-9]{6,}" required></div>
  <div class="row"><button class="btn primary" type="submit">変更する</button><button class="btn" type="button" data-act="view" data-v="dash">戻る</button></div></form>`}
let saveTimers={};
document.addEventListener('change',async e=>{
  const t=e.target;
  if(t.dataset.sales){const st=salesState();const k=t.dataset.sales;st[k]=t.value;
    if(k==='preset'&&t.value!=='custom'){const [a,b]=presetRange(t.value);st.from=a;st.to=b}
    if(k==='from'||k==='to'){st.preset='custom';if(st.from>st.to)[st.from,st.to]=[st.to,st.from]}
    render();return}
  if(t.dataset.up){const d=deal();const f=t.files&&t.files[0];if(!f)return;
    if(f.size>45*1024*1024){toast('ファイルが大きすぎます（45MBまで）');return}
    const b64=await new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(String(r.result).split(',')[1]);r.onerror=rej;r.readAsDataURL(f)});
    try{const r=await call('upload',{id:d.id,key:t.dataset.up,name:f.name,mime:f.type,b64});putDeal(r);toast(`${f.name} を保存しました`);render()}catch(_){}return}
  if(t.dataset.edit){const d=deal();const v=t.type==='checkbox'?t.checked:(t.type==='number'?+t.value:t.value);d[t.dataset.edit]=v;render();
    try{const r=await call('saveDeal',{id:d.id,deal:{[t.dataset.edit]:v}},{quiet:true});putDeal(r);render()}catch(_){}return}
  if(t.dataset.agent){const a=S.agents.find(x=>x.id===t.dataset.agent);const v=t.type==='checkbox'?t.checked:(t.type==='number'?+t.value:t.value);a[t.dataset.f]=v;
    try{const r=await call('saveAgent',{id:a.id,[t.dataset.f]:v},{quiet:true});S.agents=r;toast(`${a.name} の情報を保存しました`)}catch(_){}return}
  if(t.closest('#newForm')){autoDraft();if(t.id==='f_agent'){const a=S.agents.find(x=>x.id===t.value);if(a)document.querySelector(`#newForm input[name=tk][value=${a.takken?'self':'need'}]`).checked=true}syncForm()}
});
document.addEventListener('input',e=>{if(e.target.closest('#newForm')){if(e.target.id==='f_bfee')e.target.dataset.touched='1';syncForm();autoDraft()}});
document.addEventListener('submit',async e=>{
  e.preventDefault();
  if(e.target.id==='loginForm'){const err=document.getElementById('lg_err');err.textContent='';document.getElementById('busy').hidden=false;
    try{const r=await apiPost(null,'login',{email:document.getElementById('lg_email').value,pass:document.getElementById('lg_pass').value});
      if(r.ok){TOKEN=r.data.token;try{localStorage.setItem('signal-token',TOKEN)}catch(_){}boot()}else err.textContent=r.error}
    catch(x){err.textContent='通信エラー：'+(x&&x.message||x)}finally{document.getElementById('busy').hidden=true}return}
  if(e.target.id==='passForm'){try{await call('changeMyPass',{oldPass:document.getElementById('mp_old').value,newPass:document.getElementById('mp_new').value});toast('パスコードを変更しました');UI.view='dash';render()}catch(_){}return}
  if(e.target.id==='addAgentForm'){try{S.agents=await call('addAgent',{name:document.getElementById('na_name').value,email:document.getElementById('na_email').value,rate:document.getElementById('na_rate').value,rateRent:document.getElementById('na_rent').value,registered:document.getElementById('na_reg').checked,takken:document.getElementById('na_tk').checked});toast('追加しました。「発行」でパスコードを設定してください');render()}catch(_){}return}
  if(e.target.id!=='newForm')return;
  const v=readForm();if(!v.name||!v.contractDate){toast('案件名と契約予定日を入力してください');return}
  try{const d=await call('createDeal',v);delDraft();putDeal(d);UI={...UI,view:'deal',dealId:d.id,stageView:null};toast('契約予定を登録し、案件フォルダを作成しました');render();window.scrollTo(0,0)}catch(_){}
});
boot();
</script>

<script>
if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))}
